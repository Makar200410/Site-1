name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (Astro + TypeScript)
        run: npm run check

      # Валидация Zod-схем контента (задания, теория, разбор заданий,
      # пробники) происходит автоматически внутри `astro build` — сборка
      # падает с понятной ошибкой, если в контенте нарушена схема.
      - name: Build (includes content schema validation)
        run: npm run build
        env:
          PUBLIC_YM_ID: ${{ secrets.PUBLIC_YM_ID }}
